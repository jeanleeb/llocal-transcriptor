<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLocal Transcriptor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>LLocal Transcriptor</h1>
      <span id="status-indicator" class="status disconnected">Desconectado</span>
    </header>

    <div class="controls">
      <div class="select-group">
        <label for="model-select">Modelo</label>
        <select id="model-select">
          <option value="tiny">tiny</option>
          <option value="base" selected>base</option>
          <option value="small">small</option>
          <option value="medium">medium</option>
          <option value="large-v3">large-v3</option>
        </select>
      </div>

      <div class="select-group">
        <label for="language-select">Idioma</label>
        <select id="language-select">
          <option value="auto" selected>auto</option>
          <option value="pt">Português</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <button id="toggle-btn" class="btn btn-start">Iniciar Transcrição</button>

    <div class="transcript-area">
      <div id="transcript-text" class="transcript-text">
        <p class="placeholder">A transcrição aparecerá aqui...</p>
      </div>
    </div>

    <div class="actions">
      <button id="copy-btn" class="btn btn-secondary" disabled>Copiar</button>
      <button id="clear-btn" class="btn btn-secondary" disabled>Limpar</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
